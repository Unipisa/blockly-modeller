<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sender</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 8px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Sender</h1>
  <textarea id="msg" placeholder="Type your message..."></textarea>
  <br />
  <button id="sendBtn">Send</button>

  <script>
    const ws = new WebSocket("wss://" + window.location.host + "/sender");

    ws.onopen = () => console.log("✅ Connected to WebSocket server");
    ws.onerror = (err) => console.error("❌ WebSocket error:", err);

    document.getElementById("sendBtn").onclick = () => {
      const msg = document.getElementById("msg").value.trim();
      if (msg) {
        ws.send(msg);
        document.getElementById("msg").value = "";
      }
    };
  </script>
</body>
</html>
